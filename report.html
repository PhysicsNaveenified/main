<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>Live Test Reports</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');
:root{--gold:#ffd84d;--blue:#5aafff;--navy:#0b1330;--white:#faf8f2;--muted:rgba(250,248,242,.62);--line:rgba(255,216,77,.2);--red:#ff6b6b;--green:#5fd38d}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--navy);color:var(--white);font-family:Inter,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:1.4rem 5vw 4rem}.narrow{max-width:420px;padding-top:12vh}
h1{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:2.2rem}h2{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:1.5rem;margin:1.8rem 0 .6rem}
.card{background:rgba(255,216,77,.05);border:1px solid var(--line);border-radius:6px;padding:1.2rem;margin-top:1rem}
input{width:100%;padding:.65rem;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:3px;color:var(--white);font:inherit}
label{display:block;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .3rem}
.btn{padding:.6rem 1.1rem;background:var(--gold);color:var(--navy);border:0;border-radius:3px;font:600 .75rem Inter;cursor:pointer}.btn.g{background:transparent;color:var(--gold);border:1px solid var(--line)}.btn.on{background:var(--gold);color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:.85rem}th{text-align:left;color:var(--gold);font-size:.68rem;letter-spacing:1px;text-transform:uppercase;padding:.55rem .5rem;white-space:nowrap}
td{padding:.65rem .5rem;border-top:1px solid rgba(255,216,77,.1);vertical-align:top}tr.c{cursor:pointer}tr.c:hover,tr.c.sel{background:rgba(255,255,255,.05)}
.sc{overflow-x:auto}.msg{color:var(--red);font-size:.85rem;margin-top:.8rem;min-height:1.2em}.mut{color:var(--muted);font-size:.8rem}
.d3{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;padding:.4rem .3rem}@media(max-width:640px){.d3{grid-template-columns:1fr}}
.d3 h4{color:var(--gold);font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.4rem}.d3 ol{padding-left:1.2rem}.d3 li{padding:.15rem 0}
.abs{grid-column:1/-1;padding-top:.6rem;border-top:1px dashed var(--line)}.rem{grid-column:1/-1;padding:.6rem .8rem;border-left:3px solid var(--gold);background:rgba(255,216,77,.07)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border-color:#bbb;background:#fff}h1,h2,th{color:#000}td{border-color:#ddd}}
</style></head><body>
<div id="login" class="wrap narrow"><h1>Live Test Reports</h1><p class="mut">Authorised school staff only.</p>
  <div class="card"><label>User ID</label><input id="u" autocomplete="username"/><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
  <label style="display:flex;gap:.45rem;align-items:center;text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--white);cursor:pointer"><input type="checkbox" id="showpw" style="width:auto" onchange="$('p').type=this.checked?'text':'password'"/> Show password</label>
  <div class="msg" id="lmsg"></div><button class="btn" id="lbtn" onclick="doLogin()" style="margin-top:.6rem">Sign in</button></div></div>

<div id="app" style="display:none"><div class="wrap">
  <header style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div><h1>Live Test Reports</h1><p class="mut" id="who"></p></div>
    <div class="noprint" style="display:flex;gap:.5rem"><button class="btn g" onclick="window.print()">Print / Save PDF</button><button class="btn g" onclick="logout()">Sign out</button></div></header>
  <div class="noprint" id="chips" style="display:flex;gap:.4rem;margin-top:1rem"></div>
  <div class="card"><b>Average score by test</b> <span class="mut">— click a point to open that test</span><div class="sc" id="graph"></div></div>
  <h2>Tests</h2><p class="mut noprint">Click a test to see its top 5, lowest 5 and absentees.</p>
  <div class="card sc" id="list"></div>
</div></div>

<script>
const SB_URL='https://cyynkucowogcetrsuvzb.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5eW5rdWNvd29nY2V0cnN1dnpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMjQyMjEsImV4cCI6MjA5ODkwMDIyMX0.nF6UKi9icYOBYkgrCdnqQvmDB1b3978NSE5VHBbUHVA';
let T=sessionStorage.getItem('rt'),D={exams:[],names:true,label:''},CLS='',cache={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const num=v=>v==null?'–':String(Math.round(v*10)/10);
const COL={'11':'#ffd84d','12':'#5aafff'},EXTRA=['#5fd38d','#ff9f68','#c792ea'];
const ccol=(c,i)=>COL[c]||EXTRA[i%EXTRA.length];
async function rpc(fn,args){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=(j&&j.message)||'Request failed';if(/unauthorized/i.test(m))logout(true);throw new Error(m)}
  return j;
}
async function doLogin(){
  $('lmsg').textContent='';$('lbtn').disabled=true;
  try{const r=await rpc('live_report_login',{p_user:$('u').value,p_password:$('p').value});
    if(!r.ok){$('lmsg').textContent=r.msg;$('lbtn').disabled=false;return}
    T=r.token;sessionStorage.setItem('rt',T);$('p').value='';$('p').type='password';$('showpw').checked=false;await boot();
  }catch(e){$('lmsg').textContent='Could not connect. Please check the internet and try again.'}
  $('lbtn').disabled=false;
}
function logout(expired){T=null;sessionStorage.removeItem('rt');$('app').style.display='none';$('login').style.display='block';$('lmsg').textContent=expired===true?'Your session has ended. Please sign in again.':''}
async function boot(){
  try{const o=await rpc('live_report_overview',{p_token:T});D={exams:o.exams||[],names:o.names,label:o.label};cache={};CLS='';
    const by={};D.exams.forEach(e=>(by[e.class]=by[e.class]||[]).push(e));
    Object.values(by).forEach(a=>{a.sort((x,y)=>x.start_at.localeCompare(y.start_at));a.forEach((e,i)=>e.no=i+1)});   // test number within its class
    $('who').textContent='Signed in as '+D.label;$('login').style.display='none';$('app').style.display='block';render();
  }catch(e){if(T)$('lmsg').textContent=e.message}
}
function chips(){
  const cl=[...new Set(D.exams.map(e=>e.class).filter(Boolean))].sort();
  $('chips').innerHTML=cl.length>1?['',...cl].map(c=>`<button class="btn g ${CLS===c?'on':''}" data-c="${esc(c)}">${c?'Class '+esc(c):'All classes'}</button>`).join(''):'';
  $('chips').onclick=ev=>{const b=ev.target.closest('[data-c]');if(b){CLS=b.dataset.c;render()}};
}
function render(){chips();graph();list()}
function graph(){
  const E=D.exams.filter(e=>(!CLS||e.class===CLS)&&e.n>0),cl=[...new Set(E.map(e=>e.class))].sort(),mx=Math.max(1,...E.map(e=>e.no));
  if(!E.length){$('graph').innerHTML='<p class="mut" style="padding:1rem">No completed tests yet.</p>';return}
  const W=780,H=270,x=n=>mx>1?70+(n-1)*(W-110)/(mx-1):W/2,y=v=>215-v*1.9;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.max(560,mx*60)}px;width:100%">`;
  [0,25,50,75,100].forEach(v=>s+=`<line x1="55" x2="${W-15}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.12)"/><text x="48" y="${y(v)+4}" fill="#aaa" font-size="11" text-anchor="end">${v}</text>`);
  for(let n=1;n<=mx;n++)s+=`<text x="${x(n)}" y="236" fill="#aaa" font-size="11" text-anchor="middle">${n}</text>`;
  s+=`<text x="${W/2}" y="262" fill="#ccc" font-size="12" text-anchor="middle">Test number</text><text transform="translate(14 ${W/6}) rotate(-90)" fill="#ccc" font-size="12" text-anchor="middle">Average score (%)</text>`;
  cl.forEach((c,i)=>{const P=E.filter(e=>e.class===c).sort((a,b)=>a.no-b.no),k=ccol(c,i);
    s+=`<polyline fill="none" stroke="${k}" stroke-width="2.5" points="${P.map(e=>x(e.no)+','+y(e.avg)).join(' ')}"/>`;
    P.forEach(e=>s+=`<circle cx="${x(e.no)}" cy="${y(e.avg)}" r="5.5" fill="${k}" style="cursor:pointer" data-p="${e.id}"><title>Class ${esc(c)} · Test ${e.no} · ${esc(e.title)} · ${num(e.avg)}%</title></circle><text x="${x(e.no)}" y="${y(e.avg)+(i?17:-9)}" fill="${k}" font-size="11" text-anchor="middle">${num(e.avg)}</text>`)});
  cl.forEach((c,i)=>s+=`<line x1="${W-150+i*75}" x2="${W-132+i*75}" y1="14" y2="14" stroke="${ccol(c,i)}" stroke-width="3"/><text x="${W-128+i*75}" y="18" fill="#ddd" font-size="12">Class ${esc(c)}</text>`);
  $('graph').innerHTML=s+'</svg>';
  $('graph').onclick=ev=>{const p=ev.target.closest('[data-p]');if(p)pick(p.dataset.p)};
}
function list(){
  const E=D.exams.filter(e=>!CLS||e.class===CLS).slice().reverse();
  $('list').innerHTML='<table><tr><th>Test</th><th>Class</th><th>Date</th><th>Present / Total</th><th>Average score</th><th>Highest</th><th>Lowest</th></tr>'+
    (E.map(e=>`<tr class="c" data-e="${e.id}"><td><b>Test ${e.no}</b> — ${esc(e.title)}</td><td>${esc(e.class)}</td><td>${fd(e.start_at)}</td><td>${e.n} / ${e.rostered}</td>
      <td>${e.n?num(e.avg_score)+' / '+num(e.total)+' <span class="mut">('+num(e.avg)+'%)</span>':'–'}</td><td>${e.n?num(e.high)+' / '+num(e.total):'–'}</td><td>${e.n?num(e.low)+' / '+num(e.total):'–'}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">No tests yet.</td></tr>')+'</table>';
  $('list').onclick=ev=>{const r=ev.target.closest('tr[data-e]');if(r)toggle(r.dataset.e)};
}
function pick(id){const r=document.querySelector(`tr[data-e="${id}"]`);if(!r)return;r.scrollIntoView({behavior:'smooth',block:'center'});if(!r.classList.contains('sel'))toggle(id)}
async function toggle(id){
  const row=document.querySelector(`tr[data-e="${id}"]`),was=row.classList.contains('sel');
  document.querySelectorAll('tr.dt').forEach(n=>n.remove());document.querySelectorAll('tr.sel').forEach(n=>n.classList.remove('sel'));
  if(was)return;row.classList.add('sel');
  row.insertAdjacentHTML('afterend','<tr class="dt"><td colspan="7" class="mut">Loading...</td></tr>');
  try{const d=cache[id]||(cache[id]=await rpc('live_report_test',{p_token:T,p_exam:id}));const el=row.nextElementSibling;if(el&&el.classList.contains('dt'))el.firstChild.innerHTML=detail(D.exams.find(e=>e.id===id),d)}
  catch(e){const el=row.nextElementSibling;if(el&&el.classList.contains('dt'))el.firstChild.innerHTML='<span class="msg">'+esc(e.message)+'</span>'}
}
function detail(e,d){
  const who=s=>(d.names?`${esc(s.name||s.reg)}${s.name&&s.reg?' <span class="mut">('+esc(s.reg)+')</span>':''} — `:'')+`<b>${num(s.score)} / ${num(s.total)}</b>`;
  const li=a=>a.length?'<ol>'+a.map(s=>`<li>${who(s)}</li>`).join('')+'</ol>':'<p class="mut">—</p>';
  const ab=d.absent_count,tot=e.rostered;
  let st=!ab?`All ${tot} students were present.`:d.names?`${ab} of ${tot} student${ab>1?'s were':' was'} absent: ${d.absent.map(a=>esc((a.name||'')+(a.reg?' ('+a.reg+')':''))).join(', ')}.`:`${ab} of ${tot} student${ab>1?'s were':' was'} absent.`;
  if(!d.finished)st+=' <span class="mut">(The test may still be in progress, so this can change.)</span>';
  return `<div class="d3">${e.remark?`<div class="rem"><span class="mut">Teacher’s remark:</span><br>${esc(e.remark).replace(/\n/g,'<br>')}</div>`:''}
    <div><h4>Top 5 students</h4>${e.n?li(d.top):'<p class="mut">No submissions yet.</p>'}</div>
    <div><h4>Lowest 5 students</h4>${e.n>5?li(d.bottom):'<p class="mut">'+(e.n?'Fewer than 6 students attempted, so every student appears in the top list.':'No submissions yet.')+'</p>'}</div>
    <div class="abs"><b>Absentees:</b> ${st}</div></div>`;
}
if(T)boot();
</script></body></html>
